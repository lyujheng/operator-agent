[project]
name = "operator_allocation"
version = "0.1.0"
description = "Operator requirement allocation agent - identify, link, and output operator assignments"
requires-python = ">=3.10"
dependencies = [
    "agent_framework",
    "openpyxl>=3.1",
    "pydantic-settings>=2.0",
]

[project.scripts]
operator-allocation = "operator_allocation.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/operator_allocation"]

[tool.uv.sources]
agent-framework = { workspace = true }
