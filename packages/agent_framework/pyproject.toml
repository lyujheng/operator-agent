[project]
name = "agent_framework"
version = "0.1.0"
description = "Reusable agent framework: LLM client, MCP communication, ReAct/PlanSolve loops, tracing"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_framework"]
