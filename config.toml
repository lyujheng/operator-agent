# Operator Allocation Agent — Configuration
# Sensitive values (api_key) should be set via environment variables
# or filled in config.local.toml (gitignored).

[llm]
base_url = ""                       # LLM API endpoint, e.g. "https://api.openai.com/v1"
api_key = ""                        # or set env LLM_API_KEY (recommended)
model = ""                          # e.g. "gpt-4"
timeout = 120
max_retries = 3
structured_output_mode = "openai"   # "openai" | "claude" | "fallback"

[repos]
base_dir = ""                       # absolute path to repo clones directory

[excel]
dev_table_path = ""                 # path to dev table Excel file
output_dir = "output"

[agent]
identify_max_turns = 20
process_max_turns = 30
max_retries = 10
max_tool_result_chars = 8000
context_compress_threshold = 30000

[lib_repo_mapping]
# Maps dev table group (lib/sheet name) → source code repo directory name.
# Key = sheet name in dev table Excel, Value = directory under repos.base_dir.
FlagGems = "pytorch"
FlagGems-vllm = "vllm"
FlagGems-sglang = "sglang"

[no_dev_filter]
# Per-lib no_dev filter configuration. Libs without config skip filtering.
[no_dev_filter.FlagGems]
known_list_path = "repo/torch_no_dev_ops.md"
pending_list_path = "repo/torch_no_dev_ops_pending.md"
prompt_path = "repo/prompts/torch_no_dev_prompt.md"
llm_batch_size = 8
confidence_threshold = "high"

[no_dev_filter.FlagGems-vllm]
known_list_path = "repo/vllm_no_dev_ops.md"
pending_list_path = "repo/vllm_no_dev_ops_pending.md"
prompt_path = "repo/prompts/vllm_no_dev_prompt.md"
llm_batch_size = 8
confidence_threshold = "high"
